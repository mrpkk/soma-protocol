[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-protocol"
version = "1.1.0"
description = "Soma — протокол коммуникации агентов: доверие, память, расчёт"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mitra" }]
keywords = ["agents", "protocol", "mcp", "a2a", "trust", "memory", "x402"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=42"]          # Ed25519-подпись (без неё — HMAC-режим)
schema = ["jsonschema>=4.20"]        # строгая проверка по схеме
mcp = ["mcp>=2.0"]                   # MCP-адаптер
dev = ["pytest>=8", "cryptography>=42", "jsonschema>=4.20"]

[project.scripts]
soma = "soma.cli:main"

[project.urls]
Homepage = "https://github.com/mrpkk/soma-protocol"
Protocol = "https://github.com/mrpkk/soma-protocol/blob/main/PROTOCOL.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
