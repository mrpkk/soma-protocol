name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установить
        run: pip install -e ".[dev]"
      - name: Тесты протокола и соответствия
        run: pytest -v
      - name: Схема валидна
        run: python -c "import json;json.load(open('schemas/envelope.schema.json'))"
